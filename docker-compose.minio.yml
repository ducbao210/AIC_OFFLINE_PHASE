services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    ports:
      - "9100:9000"
      - "9001:9001"

    volumes:
      - /run/media/ducbao210/DATA1/minio/data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
